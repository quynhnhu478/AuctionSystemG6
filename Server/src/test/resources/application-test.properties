# 1. Cau hinh ket noi H2 database trong bo nho RAM
spring.datasource.url=jdbc:h2:mem:auction_test_db;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Cau hình JPA/Hibernate tu dong tao bang tu Entity và xoa di sau khi test xong
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.jakarta.persistence.schema-generation.database.action=create

# 3. Hien thi cac cau lenh sql duoi console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
